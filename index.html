<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fishnoply Multiplayer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:'Segoe UI',sans-serif;color:#fff;}

/* LOBBY */
#lobby{position:fixed;inset:0;background:linear-gradient(180deg,#0a1628 0%,#0d2444 60%,#0a1628 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:24px;}
#lobby h1{font-size:44px;color:#00d4ff;text-shadow:0 0 30px #00a8cc;letter-spacing:4px;margin-bottom:2px;}
#lobby .tagline{color:#4ab8d4;font-size:12px;letter-spacing:3px;margin-bottom:4px;}
#lobby .credit{color:#1a4a6a;font-size:11px;letter-spacing:1px;margin-bottom:28px;}
#lobby .fish-row{font-size:32px;margin-bottom:28px;letter-spacing:6px;}
#lobby .section{width:100%;max-width:320px;margin-bottom:16px;}
#lobby .section-title{font-size:11px;color:#4a8a9a;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;}
#lobby input{width:100%;background:#0d2040;border:1px solid rgba(0,200,255,0.25);border-radius:10px;padding:11px 14px;font-size:15px;color:#fff;outline:none;letter-spacing:1px;}
#lobby input:focus{border-color:rgba(0,200,255,0.6);}
#lobby input::placeholder{color:#2a5a7a;}
.lobby-btn{width:100%;max-width:320px;padding:13px;border:none;border-radius:24px;font-size:16px;font-weight:bold;cursor:pointer;letter-spacing:1px;margin-bottom:10px;}
.lobby-btn-host{background:linear-gradient(135deg,#006688,#00aacc);color:#fff;}
.lobby-btn-join{background:linear-gradient(135deg,#1a4a1a,#2a8a2a);color:#fff;}
.lobby-btn:active{transform:scale(0.97);}
#lobby .or{color:#2a5a7a;font-size:12px;margin:4px 0 14px;letter-spacing:2px;}
#token-pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px;}
.token-opt{font-size:28px;padding:6px;border-radius:10px;border:2px solid transparent;cursor:pointer;}
.token-opt.selected{border-color:#00d4ff;background:rgba(0,200,255,0.15);}
#status-msg{color:#4ab8d4;font-size:13px;text-align:center;margin-top:12px;min-height:20px;letter-spacing:1px;}
#waiting-room{display:none;width:100%;max-width:320px;background:#0d2040;border-radius:12px;padding:14px;border:1px solid rgba(0,200,255,0.2);}
#waiting-room h3{color:#00d4ff;font-size:14px;margin-bottom:10px;letter-spacing:1px;}
#waiting-list{font-size:13px;color:#7ab8cc;line-height:2;}
#room-code-display{font-size:32px;font-weight:bold;color:#ffd700;letter-spacing:8px;text-align:center;margin:8px 0;}
.start-game-btn{width:100%;padding:12px;border:none;border-radius:20px;background:#006688;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px;letter-spacing:1px;}
.start-game-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* GAME */
#game{display:none;position:fixed;inset:0;flex-direction:column;}
#topbar{background:rgba(0,20,40,0.95);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,200,255,0.15);flex-shrink:0;}
#topbar .title{font-size:15px;color:#00d4ff;font-weight:bold;letter-spacing:2px;}
#topbar .pearls{font-size:13px;color:#ffd700;}
#players-bar{background:rgba(0,10,25,0.9);padding:5px 8px;display:flex;gap:5px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid rgba(0,200,255,0.1);}
.player-chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.06);border-radius:20px;padding:3px 9px;font-size:11px;white-space:nowrap;border:1.5px solid transparent;}
.player-chip.active{border-color:rgba(0,200,255,0.6);background:rgba(0,200,255,0.12);}
.player-chip.bankrupt{opacity:0.3;text-decoration:line-through;}
.chip-pearls{color:#ffd700;}
#board-wrap{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
#board-canvas{touch-action:none;}
#panel{background:rgba(0,15,35,0.97);border-top:1px solid rgba(0,200,255,0.2);padding:8px 12px;flex-shrink:0;min-height:155px;max-height:195px;overflow-y:auto;}
#panel .turn-header{font-size:12px;color:#00d4ff;font-weight:bold;margin-bottom:5px;letter-spacing:1px;}
#panel .log{font-size:11px;color:#7ab8cc;line-height:1.5;margin-bottom:7px;max-height:50px;overflow-y:auto;}
#panel .actions{display:flex;gap:7px;flex-wrap:wrap;}
.btn{padding:8px 16px;border:none;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer;letter-spacing:.5px;}
.btn-primary{background:#006688;color:#fff;}
.btn-primary:active{background:#004466;}
.btn-secondary{background:#1a3a4a;color:#7ab8cc;border:1px solid #2a5a6a;}
.btn-secondary:active{background:#0a2030;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;}
#modal{background:#0a1e35;border:1px solid rgba(0,200,255,0.3);border-radius:16px;padding:20px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;}
#modal h2{color:#00d4ff;font-size:17px;margin-bottom:10px;letter-spacing:1px;}
#modal p{color:#7ab8cc;font-size:13px;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;}
#modal .modal-actions{display:flex;gap:8px;flex-wrap:wrap;}
#dice-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;pointer-events:none;}
#dice-display{font-size:80px;text-align:center;text-shadow:0 0 30px #fff;}
#waiting-turn{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,10,25,0.92);border-top:1px solid rgba(0,200,255,0.15);padding:10px;text-align:center;font-size:13px;color:#4a8a9a;display:none;z-index:5;letter-spacing:1px;}
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <div class="fish-row">🐟🦀🦑🦈</div>
  <h1>FISHNOPLY</h1>
  <div class="tagline">MULTIPLAYER OCEAN GAME</div>
  <div class="credit">Created by Ethan &amp; Elroy Fang · 2026</div>

  <div class="section">
    <div class="section-title">Choose your token</div>
    <div id="token-pick">
      <span class="token-opt selected" data-token="🦈">🦈</span>
      <span class="token-opt" data-token="🐠">🐠</span>
      <span class="token-opt" data-token="🦀">🦀</span>
      <span class="token-opt" data-token="🐡">🐡</span>
      <span class="token-opt" data-token="🐙">🐙</span>
      <span class="token-opt" data-token="🦑">🦑</span>
      <span class="token-opt" data-token="🐬">🐬</span>
      <span class="token-opt" data-token="🦞">🦞</span>
    </div>
    <div class="section">
      <div class="section-title">Your name</div>
      <input id="player-name" placeholder="Enter your name" maxlength="12" value=""/>
    </div>
  </div>

  <button class="lobby-btn lobby-btn-host" id="host-btn">🌊 Host New Game</button>
  <div class="or">— OR —</div>
  <div class="section">
    <div class="section-title">Room code</div>
    <input id="join-code" placeholder="Enter 4-digit code" maxlength="4" style="text-align:center;font-size:22px;letter-spacing:8px;" type="number"/>
  </div>
  <button class="lobby-btn lobby-btn-join" id="join-btn">🐟 Join Game</button>

  <div id="status-msg"></div>

  <div id="waiting-room">
    <h3>🌊 Waiting for players...</h3>
    <div id="room-code-display"></div>
    <div style="font-size:11px;color:#4a8a9a;text-align:center;margin-bottom:10px;">Share this code with friends</div>
    <div id="waiting-list"></div>
    <button class="start-game-btn" id="start-game-btn" disabled>Start Game (need 2+ players)</button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div id="topbar">
    <div class="title">🌊 FISHNOPLY</div>
    <div class="pearls" id="top-pearls">🪙 1500</div>
  </div>
  <div id="players-bar"></div>
  <div id="board-wrap"><canvas id="board-canvas"></canvas></div>
  <div id="panel">
    <div class="turn-header" id="turn-header"></div>
    <div class="log" id="log"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div id="waiting-turn">Waiting for other player's turn...</div>
</div>

<div id="modal-bg">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div id="dice-overlay"><div id="dice-display"></div></div>

<script src="https://cdn.jsdelivr.net/npm/ably@1/ably.min.js"></script>
<script>
const ABLY_KEY = 'S4V2Tw.1ozI7g:9FOhAo1Uej8UubN3zVgWSnswcXAJ6wiSzHC2jBq2dZ4';

// ── GAME DATA ──────────────────────────────────────────────────
const SQUARES=[

  {type:'gonet',name:'Go to Net',emoji:'🕸️'},
  {type:'prop',name:'Col. Squid',emoji:'🦑',group:6,price:300,rent:[26,130,390,900,1100,1275],houseCost:200},
  {type:'prop',name:'Megalodon',emoji:'🦷',group:6,price:300,rent:[26,130,390,900,1100,1275],houseCost:200},
  {type:'tide',name:'Tide Card',emoji:'🌊'},
  {type:'prop',name:'Blue Whale',emoji:'🐋',group:6,price:320,rent:[28,150,450,1000,1200,1400],houseCost:200},
  {type:'sub',name:'Submarine 4',emoji:'🚢',price:200,subRent:[25,50,100,200]},
  {type:'current',name:'Current Card',emoji:'🌀'},
  {type:'prop',name:'Kraken',emoji:'🐙',group:7,price:350,rent:[35,175,500,1100,1300,1500],houseCost:200},
  {type:'tax',name:'Pearl Tax',emoji:'💸',amount:100},
  {type:'prop',name:'Leviathan',emoji:'🐉',group:7,price:400,rent:[50,200,600,1400,1700,2000],houseCost:200},
];
const GROUP_COLORS=['#8B4513','#87CEEB','#FF69B4','#FFA500','#FF4444','#FFFF00','#228B22','#00008B'];
const GROUP_NAMES=['Brown','Sky Blue','Pink','Orange','Red','Yellow','Green','Dark Blue'];
const PLAYER_COLORS=['#00aaff','#ff8800','#ff3333','#44cc44','#cc44cc','#ffcc00','#00ccaa','#ff6688'];

const TIDE_CARDS=[
  {text:'Current carries you to GO! Collect 🪙200.',action:'goto',val:0,gain:200},
  {text:'Pearl bonus! Collect 🪙50.',action:'gain',val:50},
  {text:'Salary! Collect 🪙200.',action:'gain',val:200},
  {text:'Pearl dividend! Collect 🪙50 from each player.',action:'collectall',val:50},
  {text:'Bank error! Collect 🪙200.',action:'gain',val:200},
  {text:'Pearl chest! Collect 🪙100.',action:'gain',val:100},
  {text:'Deep sea repairs. Pay 🪙150.',action:'pay',val:150},
  {text:'Pearl doctor. Pay 🪙100.',action:'pay',val:100},
  {text:'Go directly to The Net!',action:'gonet',val:0},
  {text:'Get out of The Net free!',action:'jailcard',val:0},
  {text:'Ocean Mayor elected. Pay 🪙50 to each.',action:'payall',val:50},
  {text:'Advance to Kraken!',action:'goto',val:37,gain:0},
];
const CURRENT_CARDS=[
  {text:'Ride to GO! Collect 🪙200.',action:'goto',val:0,gain:200},
  {text:'Beauty Contest! Collect 🪙10.',action:'gain',val:10},
  {text:'Tax refund! Collect 🪙20.',action:'gain',val:20},
  {text:'Go to The Net.',action:'gonet',val:0},
  {text:'Get out of The Net free!',action:'jailcard',val:0},
  {text:'Advance to Submarine 1!',action:'goto',val:5,gain:0},
  {text:'Go back 3 squares.',action:'back',val:3},
  {text:'Fin maintenance. Pay 🪙15.',action:'pay',val:15},
  {text:'Sonar repairs. Pay 🪙100.',action:'pay',val:100},
  {text:'Collect 🪙25 from each player.',action:'collectall',val:25},
  {text:'Advance to Leviathan!',action:'goto',val:39,gain:0},
  {text:'Repairs — 🪙40/fish, 🪙115/castle.',action:'repairs',val:[40,115]},
];

// ── STATE ──────────────────────────────────────────────────────
let ably, channel;
let roomCode = null;
let myId = null;  // my player index in PLAYERS array
let isHost = false;
let gameStarted = false;

// Shared game state (host is source of truth, broadcasts to all)
let PLAYERS = [];
let ownership = new Array(40).fill(null);
let houses = new Array(40).fill(0);
let currentPlayer = 0;
let tideDeck = [];
let currentDeck = [];
let logLines = [];
let diceResult = [1,1];
let pendingBuyCallback = null;

// Lobby state
let lobbyPlayers = []; // [{id, name, token, color}]
let myToken = '🦈';
let myName = '';

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

// ── LOBBY UI ──────────────────────────────────────────────────
document.querySelectorAll('.token-opt').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.token-opt').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    myToken=el.dataset.token;
  });
});

function setStatus(msg){document.getElementById('status-msg').textContent=msg;}

function connectAbly(cb){
  setStatus('Connecting to ocean...');
  ably = new Ably.Realtime({key:ABLY_KEY, clientId:'player-'+Math.random().toString(36).slice(2,8)});
  ably.connection.on('connected',()=>{setStatus('');cb();});
  ably.connection.on('failed',()=>setStatus('Connection failed. Check your internet.'));
}

document.getElementById('host-btn').addEventListener('click',()=>{
  myName = document.getElementById('player-name').value.trim() || 'Player 1';
  connectAbly(()=>{
    roomCode = Math.floor(1000+Math.random()*9000).toString();
    isHost = true;
    myId = 0;
    joinRoom(roomCode);
  });
});

document.getElementById('join-btn').addEventListener('click',()=>{
  myName = document.getElementById('player-name').value.trim() || 'Guest';
  const code = document.getElementById('join-code').value.trim();
  if(code.length!==4){setStatus('Enter a 4-digit room code');return;}
  connectAbly(()=>{
    roomCode = code;
    isHost = false;
    joinRoom(roomCode);
  });
});

function joinRoom(code){
  channel = ably.channels.get('fishnoply-'+code);
  channel.subscribe(handleMessage);

  // announce presence
  const me = {name:myName, token:myToken, color:PLAYER_COLORS[0]};
  channel.publish('join',{name:myName,token:myToken});

  document.getElementById('waiting-room').style.display='block';
  document.getElementById('room-code-display').textContent=code;

  if(isHost){
    // host adds themselves
    lobbyPlayers = [{id:0,name:myName,token:myToken,color:PLAYER_COLORS[0]}];
    updateWaitingList();
    setStatus('');
    // send current lobby state after short delay
    setTimeout(()=>broadcastLobby(),500);
  } else {
    setStatus('Joining room '+code+'...');
  }
}

function broadcastLobby(){
  if(!isHost)return;
  channel.publish('lobby',{players:lobbyPlayers});
}

document.getElementById('start-game-btn').addEventListener('click',()=>{
  if(!isHost||lobbyPlayers.length<2)return;
  // Build initial game state
  const initialState = buildInitialState();
  channel.publish('start',{state:initialState});
  startGame(initialState);
});

function buildInitialState(){
  const decks = {tide:shuffle([...Array(12).keys()]), current:shuffle([...Array(12).keys()])};
  return {
    players: lobbyPlayers.map((lp,i)=>({
      name:lp.name,emoji:lp.token,color:lp.color,
      money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false
    })),
    ownership: new Array(40).fill(null),
    houses: new Array(40).fill(0),
    currentPlayer:0,
    tideDeck: decks.tide,
    currentDeck: decks.current,
    log:[]
  };
}

function updateWaitingList(){
  document.getElementById('waiting-list').innerHTML=
    lobbyPlayers.map((p,i)=>`<div>${p.token} <strong>${p.name}</strong>${i===0?' (Host)':''}</div>`).join('');
  const btn=document.getElementById('start-game-btn');
  btn.disabled=lobbyPlayers.length<2;
  btn.textContent=lobbyPlayers.length<2?'Waiting for more players...':'Start Game ('+lobbyPlayers.length+' players)';
}

// ── ABLY MESSAGING ────────────────────────────────────────────
function handleMessage(msg){
  const d=msg.data;
  switch(msg.name){
    case 'join':
      if(isHost){
        // assign color and id, add to lobby
        const newId=lobbyPlayers.length;
        if(newId>=8)return; // max 8
        const newPlayer={id:newId,name:d.name,token:d.token,color:PLAYER_COLORS[newId]};
        lobbyPlayers.push(newPlayer);
        updateWaitingList();
        setTimeout(()=>broadcastLobby(),200);
      }
      break;
    case 'lobby':
      if(!isHost){
        lobbyPlayers=d.players;
        // figure out my id by token+name match
        myId=lobbyPlayers.findIndex(p=>p.name===myName&&p.token===myToken);
        updateWaitingList();
        setStatus('Connected! Waiting for host to start...');
      }
      break;
    case 'start':
      if(!isHost) startGame(d.state);
      break;
    case 'state':
      // full state sync from host
      applyState(d);
      break;
    case 'action':
      // host processes action from non-host player
      if(isHost) processAction(d);
      break;
    case 'log':
      if(!isHost){addLog(d.msg);}
      break;
  }
}

function applyState(s){
  PLAYERS=s.players;
  ownership=s.ownership;
  houses=s.houses;
  currentPlayer=s.currentPlayer;
  if(s.log) logLines=s.log;
  diceResult=s.diceResult||[1,1];
  tideDeck=s.tideDeck||tideDeck;
  currentDeck=s.currentDeck||currentDeck;
  updateTopPearls();updatePlayersBar();drawBoard();
  renderMyTurn();
}

function broadcastState(extra){
  if(!isHost)return;
  const s={players:PLAYERS,ownership,houses,currentPlayer,log:logLines,diceResult,tideDeck,currentDeck,...extra};
  channel.publish('state',s);
}

function sendAction(type,data){
  channel.publish('action',{type,playerId:myId,...data});
}

function processAction(d){
  // host only: process actions from other players
  if(d.playerId!==currentPlayer)return;
  switch(d.type){
    case 'roll': hostDoRoll(d.playerId); break;
    case 'buy': hostDoBuy(d.playerId,d.sqIdx,d.confirm); break;
    case 'build': hostDoBuild(d.playerId,d.sqIdx); break;
    case 'jailRoll': hostJailRoll(d.playerId); break;
    case 'payBail': hostPayBail(d.playerId); break;
    case 'useJailCard': hostUseJailCard(d.playerId); break;
  }
}

// ── GAME START ────────────────────────────────────────────────
function startGame(state){
  gameStarted=true;
  applyState(state);
  document.getElementById('lobby').style.display='none';
  document.getElementById('game').style.display='flex';
  layoutBoard();drawBoard();
  renderMyTurn();
}

// ── BOARD ─────────────────────────────────────────────────────
const canvas=document.getElementById('board-canvas');
const bctx=canvas.getContext('2d');
let CELL,BOARD_SIZE;

function layoutBoard(){
  const wrap=document.getElementById('board-wrap');
  const size=Math.min(wrap.clientWidth,wrap.clientHeight)-8;
  canvas.width=size;canvas.height=size;BOARD_SIZE=size;CELL=size/11;
}

function squarePos(idx){
  const C=CELL,S=BOARD_SIZE,CW=C*1.6;
  if(idx===0)  return{x:S-CW,y:S-CW,w:CW,h:CW,corner:true,side:'br'};
  if(idx===10) return{x:0,y:S-CW,w:CW,h:CW,corner:true,side:'bl'};
  if(idx===20) return{x:0,y:0,w:CW,h:CW,corner:true,side:'tl'};
  if(idx===30) return{x:S-CW,y:0,w:CW,h:CW,corner:true,side:'tr'};
  if(idx>=1&&idx<=9){const x=S-CW-idx*C;return{x,y:S-CW,w:C,h:CW,corner:false,side:'bottom'};}
  if(idx>=11&&idx<=19){const y=S-CW-(idx-10)*C;return{x:0,y,w:CW,h:C,corner:false,side:'left'};}
  if(idx>=21&&idx<=29){const x=CW+(idx-21)*C;return{x,y:0,w:C,h:CW,corner:false,side:'top'};}
  if(idx>=31&&idx<=39){const y=CW+(idx-31)*C;return{x:S-CW,y,w:CW,h:C,corner:false,side:'right'};}
}

function drawBoard(){
  if(!BOARD_SIZE)return;
  const C=CELL,S=BOARD_SIZE,CW=C*1.6;
  bctx.clearRect(0,0,S,S);
  bctx.fillStyle='#0a1628';bctx.fillRect(0,0,S,S);
  bctx.fillStyle='#0b1e3a';bctx.fillRect(CW,CW,S-CW*2,S-CW*2);
  for(let i=0;i<40;i++)drawSquare(i);
  drawCentre();drawTokens();
}

function drawSquare(i){
  const sq=squarePos(i),s=SQUARES[i],C=CELL;
  bctx.strokeStyle='rgba(0,180,255,0.2)';bctx.lineWidth=0.5;
  bctx.strokeRect(sq.x,sq.y,sq.w,sq.h);
  if(ownership[i]!==null){bctx.fillStyle=PLAYERS[ownership[i]].color+'28';bctx.fillRect(sq.x+1,sq.y+1,sq.w-2,sq.h-2);}
  if(s.type==='prop'){
    bctx.fillStyle=GROUP_COLORS[s.group];const ST=7;
    if(sq.side==='bottom')bctx.fillRect(sq.x,sq.y,sq.w,ST);
    else if(sq.side==='left')bctx.fillRect(sq.x+sq.w-ST,sq.y,ST,sq.h);
    else if(sq.side==='top')bctx.fillRect(sq.x,sq.y+sq.h-ST,sq.w,ST);
    else if(sq.side==='right')bctx.fillRect(sq.x,sq.y,ST,sq.h);
  }
  if(houses[i]>0&&!sq.corner){
    const isC=houses[i]>=5;bctx.fillStyle=isC?'#ff4444':'#00ee55';const cnt=isC?1:houses[i];
    for(let h=0;h<cnt;h++){
      if(sq.side==='bottom'||sq.side==='top')bctx.fillRect(sq.x+3+h*6,sq.y+sq.h/2-2,5,5);
      else bctx.fillRect(sq.x+sq.w/2-2,sq.y+3+h*6,5,5);
    }
  }
  bctx.save();
  const cx=sq.x+sq.w/2,cy=sq.y+sq.h/2;
  if(sq.side==='left'){bctx.translate(cx,cy);bctx.rotate(Math.PI/2);bctx.translate(-cx,-cy);}
  else if(sq.side==='right'){bctx.translate(cx,cy);bctx.rotate(-Math.PI/2);bctx.translate(-cx,-cy);}
  else if(sq.side==='top'){bctx.translate(cx,cy);bctx.rotate(Math.PI);bctx.translate(-cx,-cy);}
  if(sq.corner){
    bctx.font=`${Math.round(C*0.38)}px sans-serif`;bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.fillText(s.emoji,cx,cy-8);
    bctx.fillStyle='#7ab8cc';bctx.font=`bold ${Math.round(C*0.15)}px sans-serif`;
    bctx.fillText(s.name,cx,cy+10);
  }else{
    bctx.font=`${Math.round(C*0.28)}px sans-serif`;bctx.textAlign='center';bctx.textBaseline='middle';
    bctx.fillText(s.emoji,cx,cy-6);
    bctx.fillStyle='#5a9aaa';bctx.font=`${Math.round(C*0.12)}px sans-serif`;
    bctx.fillText(s.name.length>8?s.name.slice(0,8):s.name,cx,cy+5);
    if(s.price){bctx.fillStyle='#ffd700';bctx.font=`${Math.round(C*0.11)}px sans-serif`;bctx.fillText('🪙'+s.price,cx,cy+14);}
  }
  bctx.restore();
}

function drawCentre(){
  const C=CELL,S=BOARD_SIZE,CW=C*1.6,cx=S/2,iy=CW,ix=CW,iw=S-CW*2,ih=S-CW*2;
  bctx.fillStyle='#00d4ff';bctx.font=`bold ${Math.round(C*0.36)}px sans-serif`;
  bctx.textAlign='center';bctx.textBaseline='middle';
  bctx.fillText('🌊 FISHNOPLY',cx,iy+16);
  bctx.fillStyle='#1a5a7a';bctx.font=`${Math.round(C*0.14)}px sans-serif`;
  bctx.fillText('Ethan & Elroy Fang · 2026',cx,iy+30);
  bctx.strokeStyle='rgba(0,180,255,0.12)';bctx.lineWidth=0.5;
  bctx.beginPath();bctx.moveTo(ix+8,iy+40);bctx.lineTo(ix+iw-8,iy+40);bctx.stroke();
  const padTop=46,gridX=ix+4,gridY=iy+padTop;
  const cols=PLAYERS.length<=2?1:2;
  const rows=Math.ceil(PLAYERS.length/cols);
  const cellW=(iw-8)/cols,cellH=(ih-padTop-4)/rows;
  PLAYERS.forEach((p,pi)=>{
    const col=pi%cols,row=Math.floor(pi/cols);
    drawPlayerPanel(p,pi,gridX+col*cellW,gridY+row*cellH,cellW-3,cellH-3);
  });
}

function drawPlayerPanel(p,pi,px,py,pw,ph){
  const C=CELL;
  const isMe=pi===myId;
  bctx.fillStyle=p.bankrupt?'rgba(40,10,10,0.6)':(currentPlayer===pi?p.color+'22':(isMe?'rgba(0,200,255,0.07)':'rgba(255,255,255,0.03)'));
  bctx.strokeStyle=isMe?(currentPlayer===pi?p.color:'rgba(0,200,255,0.4)'):(currentPlayer===pi?p.color+'88':'rgba(0,180,255,0.1)');
  bctx.lineWidth=currentPlayer===pi||isMe?1.5:0.5;
  bctx.beginPath();bctx.roundRect(px,py,pw,ph,4);bctx.fill();bctx.stroke();
  let y=py+9;
  bctx.font=`${Math.round(C*0.26)}px sans-serif`;bctx.textAlign='left';bctx.textBaseline='top';
  bctx.fillText(p.emoji,px+4,y-2);
  bctx.fillStyle=p.bankrupt?'#664444':p.color;
  bctx.font=`bold ${Math.round(C*0.15)}px sans-serif`;
  bctx.fillText((isMe?'★ ':'')+p.name+(p.bankrupt?' ✗':''),px+20,y+1);
  y+=20;
  bctx.fillStyle='#ffd700';bctx.font=`bold ${Math.round(C*0.15)}px sans-serif`;
  bctx.fillText('🪙'+p.money,px+4,y);
  bctx.fillStyle='#4a8a9a';bctx.font=`${Math.round(C*0.12)}px sans-serif`;
  bctx.fillText(p.inJail?'🕸️ Net':'📍'+(SQUARES[p.pos].name.slice(0,8)),px+4,y+12);
  y+=26;
  const myProps=SQUARES.map((sq,i)=>({sq,i})).filter(({i})=>ownership[i]===pi);
  if(myProps.length){
    bctx.fillStyle='#3a7a8a';bctx.font=`${Math.round(C*0.11)}px sans-serif`;
    bctx.fillText('Properties:',px+4,y);y+=12;
    myProps.forEach(({sq,i})=>{
      if(y>py+ph-8)return;
      const col=sq.type==='prop'?GROUP_COLORS[sq.group]:(sq.type==='sub'?'#8888ff':'#ffcc00');
      bctx.fillStyle=col;bctx.beginPath();bctx.arc(px+8,y+4,3.5,0,Math.PI*2);bctx.fill();
      bctx.fillStyle='#a0c8d8';bctx.font=`${Math.round(C*0.11)}px sans-serif`;
      const hLabel=houses[i]>=5?'🪸':(houses[i]>0?'x'+houses[i]:'');
      bctx.fillText((sq.name.length>9?sq.name.slice(0,9):sq.name)+(hLabel?' '+hLabel:''),px+14,y);
      y+=11;
    });
  }else if(!p.bankrupt){
    bctx.fillStyle='#2a5a6a';bctx.font=`${Math.round(C*0.11)}px sans-serif`;bctx.fillText('No properties',px+4,y);
  }
}

function drawTokens(){
  const C=CELL;
  const byPos={};
  PLAYERS.forEach((p,pi)=>{if(!p.bankrupt){if(!byPos[p.pos])byPos[p.pos]=[];byPos[p.pos].push(pi);}});
  Object.entries(byPos).forEach(([pos,pids])=>{
    const sq=squarePos(parseInt(pos));
    const cx=sq.x+sq.w/2,cy=sq.y+sq.h/2;
    pids.forEach((pi,offset)=>{
      const p=PLAYERS[pi];
      const angle=(offset/pids.length)*Math.PI*2-Math.PI/2;
      const r=pids.length>1?C*0.17:0;
      const tx=cx+Math.cos(angle)*r,ty=cy+Math.sin(angle)*r;
      const isActive=pi===currentPlayer,isMe=pi===myId;
      bctx.beginPath();bctx.arc(tx,ty,C*(isActive?0.27:0.21),0,Math.PI*2);
      bctx.fillStyle=isActive?p.color+'55':'rgba(0,0,0,0.4)';bctx.fill();
      bctx.strokeStyle=isActive?p.color:(isMe?'rgba(0,200,255,0.8)':p.color+'66');
      bctx.lineWidth=isActive?2.5:(isMe?1.5:1);bctx.stroke();
      bctx.font=`${Math.round(C*(isActive?0.28:0.22))}px sans-serif`;
      bctx.textAlign='center';bctx.textBaseline='middle';bctx.fillText(p.emoji,tx,ty);
    });
  });
}

}

function addLog(msg){

function setHeader(t){document.getElementById('turn-header').textContent=t;}
function setActions(btns){

  btns.forEach(b=>{const btn=document.createElement('button');btn.className='btn '+(b.cls||'btn-primary');btn.textContent=b.label;if(b.disabled)btn.disabled=true;btn.onclick=b.action;el.appendChild(btn);});

function showModal(title,body,actions){

function renderMyTurn(){

    waitEl.style.display='none';
    myTurn();
  } else {
    waitEl.style.display='block';

}

// ── MY TURN ───────────────────────────────────────────────────
function myTurn(){
  const p=PLAYERS[myId];
  if(p.bankrupt){return;}
  setHeader(`Your turn ${p.emoji} ${p.name}!`);
  if(p.inJail){
    setActions([
      {label:'Roll for doubles',cls:'btn-primary',action:()=>sendAction('jailRoll',{})},
      ...(p.jailCard?[{label:'Use Get Out card',cls:'btn-secondary',action:()=>sendAction('useJailCard',{})}]:[]),
      {label:'Pay 🪙50 bail',cls:'btn-secondary',disabled:p.money<50,action:()=>sendAction('payBail',{})},
    ]);return;
  }
  const canBuild=getBuildOptions().length>0;
  setActions([
    {label:'🎲 Roll Dice',cls:'btn-primary',action:()=>sendAction('roll',{})},
    ...(canBuild?[{label:'🪸 Build',cls:'btn-secondary',action:()=>showMyBuildMenu()}]:[]),
    {label:'🗺️ My Props',cls:'btn-secondary',action:()=>showMyProps()},
  ]);
}

function getBuildOptions(){
  if(myId===null)return[];
  const p=PLAYERS[myId];
  return SQUARES.map((sq,i)=>{
    if(sq.type!=='prop'||ownership[i]!==myId||!ownsGroup(myId,sq.group)||houses[i]>=5||p.money<sq.houseCost)return null;
    const gH=SQUARES.map((s2,i2)=>s2.type==='prop'&&s2.group===sq.group?houses[i2]:0);
    if(houses[i]>Math.min(...gH))return null;
    return{sq,i};
  }).filter(Boolean);
}

function showMyBuildMenu(){
  const builds=getBuildOptions();
  if(!builds.length)return;
  const p=PLAYERS[myId];
  showModal('🪸 Build',`Your pearls: 🪙${p.money}\n\nSelect where to build:`,[
    ...builds.map(({sq,i})=>({
      label:(houses[i]===4?`🪸 Castle on ${sq.name}`:`🏠 House on ${sq.name}`)+` 🪙${sq.houseCost}`,
      cls:'btn-primary',
      action:()=>{closeModal();sendAction('build',{sqIdx:i});}
    })),
    {label:'Cancel',cls:'btn-secondary',action:closeModal},
  ]);
}

function showMyProps(){
  const myProps=SQUARES.map((sq,i)=>({sq,i})).filter(({i})=>ownership[i]===myId);
  if(!myProps.length){showModal('🗺️ Properties','No properties yet!',[{label:'OK',cls:'btn-secondary',action:closeModal}]);return;}
  const lines=myProps.map(({sq,i})=>`${sq.emoji} ${sq.name}${houses[i]>0?' '+(houses[i]>=5?'🪸':'🏠'.repeat(houses[i])):''} — Rent:🪙${calcRent(i,7)}`).join('\n');
  showModal('🗺️ Your Properties',lines,[{label:'Close',cls:'btn-secondary',action:closeModal}]);
}

// ── HOST GAME LOGIC ───────────────────────────────────────────
// Only host runs this. Broadcasts state after each action.

const DE=['','⚀','⚁','⚂','⚃','⚄','⚅'];

function animateDice(d1,d2,cb){
  const ov=document.getElementById('dice-overlay'),dp=document.getElementById('dice-display');
  ov.style.display='flex';let n=0;
  const iv=setInterval(()=>{
    dp.textContent=DE[Math.ceil(Math.random()*6)]+' '+DE[Math.ceil(Math.random()*6)];
    if(++n>8){clearInterval(iv);dp.textContent=DE[d1]+' '+DE[d2];setTimeout(()=>{ov.style.display='none';cb();},600);}
  },80);
}

function hostLog(msg){
  addLog(msg);
  channel.publish('log',{msg});
}

function hostDoRoll(pidx){
  const d1=Math.ceil(Math.random()*6),d2=Math.ceil(Math.random()*6);
  diceResult=[d1,d2];
  const total=d1+d2,doubles=d1===d2;
  hostLog(`${PLAYERS[pidx].emoji} ${PLAYERS[pidx].name}: ${DE[d1]}${DE[d2]} (${total})${doubles?' DOUBLES!':''}`);
  animateDice(d1,d2,()=>{
    hostMovePlayer(pidx,total,()=>{
      hostLandOn(pidx,total,()=>{
        if(doubles&&!PLAYERS[pidx].inJail){
          hostLog('Doubles — roll again!');
          broadcastState();renderMyTurn();
        } else {
          hostNextTurn();
        }
      });
    });
  });
}

function hostJailRoll(pidx){
  const d1=Math.ceil(Math.random()*6),d2=Math.ceil(Math.random()*6);
  diceResult=[d1,d2];const total=d1+d2;
  animateDice(d1,d2,()=>{
    if(d1===d2){PLAYERS[pidx].inJail=false;hostLog(`${PLAYERS[pidx].emoji} rolled doubles — free from Net!`);hostMovePlayer(pidx,total,()=>hostLandOn(pidx,total,()=>hostNextTurn()));}
    else{PLAYERS[pidx].jailTurns++;
      if(PLAYERS[pidx].jailTurns>=3){PLAYERS[pidx].money=Math.max(0,PLAYERS[pidx].money-50);PLAYERS[pidx].inJail=false;hostLog(`${PLAYERS[pidx].emoji} paid 🪙50 bail`);hostMovePlayer(pidx,total,()=>hostLandOn(pidx,total,()=>hostNextTurn()));}
      else{hostLog(`${PLAYERS[pidx].emoji} stuck in Net (${PLAYERS[pidx].jailTurns}/3)`);broadcastState();renderMyTurn();hostNextTurn();}
    }
  });
}

function hostPayBail(pidx){PLAYERS[pidx].money-=50;PLAYERS[pidx].inJail=false;hostLog(`${PLAYERS[pidx].emoji} paid 🪙50 bail`);broadcastState();renderMyTurn();}
function hostUseJailCard(pidx){PLAYERS[pidx].jailCard=false;PLAYERS[pidx].inJail=false;hostLog(`${PLAYERS[pidx].emoji} used Get Out of Net card!`);broadcastState();renderMyTurn();}

function hostMovePlayer(pidx,steps,cb){
  const p=PLAYERS[pidx],old=p.pos;
  p.pos=(p.pos+steps)%40;
  if(p.pos<old&&steps>0){p.money+=200;hostLog(`${p.emoji} passed GO — 🪙200!`);}
  broadcastState();drawBoard();if(cb)cb();
}

function hostGoto(pidx,sq,collectGo,cb){
  const p=PLAYERS[pidx];
  if(sq<p.pos&&collectGo){p.money+=200;hostLog(`${p.emoji} passed GO!`);}
  p.pos=sq;broadcastState();drawBoard();if(cb)cb();
}

function ownsGroup(pidx,group){return SQUARES.map((s,i)=>({s,i})).filter(({s})=>s.type==='prop'&&s.group===group).every(({i})=>ownership[i]===pidx);}
function countSubs(pidx){return SQUARES.filter((s,i)=>s.type==='sub'&&ownership[i]===pidx).length;}
function countUtils(pidx){return SQUARES.filter((s,i)=>s.type==='utility'&&ownership[i]===pidx).length;}
function calcRent(sqIdx,dice){
  const s=SQUARES[sqIdx],ow=ownership[sqIdx];if(ow===null)return 0;
  if(s.type==='sub')return s.subRent[countSubs(ow)-1];
  if(s.type==='utility')return dice*(countUtils(ow)===1?4:10);
  if(s.type==='prop'){const h=houses[sqIdx];if(h>0)return s.rent[Math.min(h,5)];if(ownsGroup(ow,s.group))return s.rent[0]*2;return s.rent[0];}
  return 0;
}

function hostPayRent(from,to,amt,cb){
  PLAYERS[from].money=Math.max(0,PLAYERS[from].money-amt);PLAYERS[to].money+=amt;
  hostLog(`${PLAYERS[from].emoji} paid 🪙${amt} rent to ${PLAYERS[to].emoji}`);
  broadcastState();hostCheckBankruptcy(from,cb);
}

function hostCheckBankruptcy(pidx,cb){
  const p=PLAYERS[pidx];
  if(p.money<=0){
    p.bankrupt=true;hostLog(`💀 ${p.emoji} ${p.name} is bankrupt!`);
    SQUARES.forEach((s,i)=>{if(ownership[i]===pidx){ownership[i]=null;houses[i]=0;}});
    broadcastState();drawBoard();
    const alive=PLAYERS.filter(pl=>!pl.bankrupt);
    if(alive.length===1){hostShowWinner(PLAYERS.indexOf(alive[0]));return;}
  }
  if(cb)cb();
}

function hostShowWinner(pidx){
  const p=PLAYERS[pidx];
  hostLog(`🏆 ${p.emoji} ${p.name} WINS THE OCEAN!`);
  broadcastState();
  showModal(`${p.emoji} ${p.name} WINS!`,`${p.name} dominates the ocean with 🪙${p.money} pearls!\n\nAll others are bankrupt!`,[{label:'Play Again',cls:'btn-primary',action:()=>location.reload()}]);
}

function hostApplyCard(pidx,card,cb){
  const p=PLAYERS[pidx];
  hostLog(`${p.emoji}: "${card.text}"`);
  switch(card.action){
    case 'gain':p.money+=card.val;broadcastState();if(cb)cb();break;
    case 'pay':p.money=Math.max(0,p.money-card.val);broadcastState();hostCheckBankruptcy(pidx,cb);break;
    case 'goto':hostGoto(pidx,card.val,true,()=>hostLandOn(pidx,diceResult[0]+diceResult[1],cb));break;
    case 'gonet':p.inJail=true;p.jailTurns=0;p.pos=10;hostLog(`${p.emoji} sent to The Net!`);broadcastState();drawBoard();if(cb)cb();break;
    case 'jailcard':p.jailCard=true;broadcastState();if(cb)cb();break;
    case 'back':p.pos=(p.pos-card.val+40)%40;broadcastState();drawBoard();hostLandOn(pidx,diceResult[0]+diceResult[1],cb);break;
    case 'collectall':PLAYERS.forEach((pl,i)=>{if(i!==pidx&&!pl.bankrupt){pl.money=Math.max(0,pl.money-card.val);p.money+=card.val;}});broadcastState();if(cb)cb();break;
    case 'payall':PLAYERS.forEach((pl,i)=>{if(i!==pidx&&!pl.bankrupt){pl.money+=card.val;p.money=Math.max(0,p.money-card.val);}});broadcastState();hostCheckBankruptcy(pidx,cb);break;
    case 'repairs':{let tot=0;SQUARES.forEach((s,i)=>{if(ownership[i]===pidx&&houses[i]>0)tot+=houses[i]<5?houses[i]*card.val[0]:card.val[1];});p.money=Math.max(0,p.money-tot);hostLog(`${p.emoji} paid 🪙${tot} repairs`);broadcastState();hostCheckBankruptcy(pidx,cb);break;}
    default:if(cb)cb();
  }
}

function hostLandOn(pidx,dice,cb){
  const p=PLAYERS[pidx],sq=SQUARES[p.pos],ow=ownership[p.pos];
  switch(sq.type){
    case 'go':case 'jail':case 'freeswim':if(cb)cb();break;
    case 'gonet':p.inJail=true;p.jailTurns=0;p.pos=10;hostLog(`${p.emoji} sent to The Net!`);broadcastState();drawBoard();if(cb)cb();break;
    case 'tax':p.money=Math.max(0,p.money-sq.amount);hostLog(`${p.emoji} paid 🪙${sq.amount} tax`);broadcastState();hostCheckBankruptcy(pidx,cb);break;
    case 'tide':
      if(!tideDeck.length)tideDeck=shuffle([...Array(12).keys()]);
      hostApplyCard(pidx,TIDE_CARDS[tideDeck.pop()],cb);break;
    case 'current':
      if(!currentDeck.length)currentDeck=shuffle([...Array(12).keys()]);
      hostApplyCard(pidx,CURRENT_CARDS[currentDeck.pop()],cb);break;
    case 'prop':case 'sub':case 'utility':
      if(ow===null){
        // offer buy — broadcast state, player will send back buy action
        broadcastState();
        if(pidx===myId){
          // I'm the one landing, show buy modal
          showModal(`Buy ${sq.emoji} ${sq.name}?`,
            `Price: 🪙${sq.price}\nYour pearls: 🪙${p.money}${sq.type==='prop'?'\nGroup: '+GROUP_NAMES[sq.group]+'\nBase rent: 🪙'+sq.rent[0]:''}`,
            [{label:`Buy 🪙${sq.price}`,cls:'btn-primary',disabled:p.money<sq.price,action:()=>{closeModal();hostDoBuy(pidx,p.pos,true);}},
             {label:'Pass',cls:'btn-secondary',action:()=>{closeModal();hostDoBuy(pidx,p.pos,false);}}]);
        } else {
          // ask non-host player — wait for their buy action
          // set a timeout fallback (AI-like: buy if can afford)
          pendingBuyCallback=cb;
          setTimeout(()=>{if(pendingBuyCallback){hostDoBuy(pidx,p.pos,false);pendingBuyCallback=null;}},20000);
        }
      }
      else if(ow===pidx){hostLog(`${p.emoji} owns this`);if(cb)cb();}
      else{const rent=calcRent(p.pos,dice);hostLog(`${p.emoji} owes 🪙${rent}`);hostPayRent(pidx,ow,rent,cb);}
      break;
    default:if(cb)cb();
  }
}

function hostDoBuy(pidx,sqIdx,confirm){
  const sq=SQUARES[sqIdx],p=PLAYERS[pidx];
  if(confirm&&p.money>=sq.price){
    p.money-=sq.price;ownership[sqIdx]=pidx;
    hostLog(`${p.emoji} bought ${sq.emoji} ${sq.name} for 🪙${sq.price}`);
  }else{hostLog(`${p.emoji} passed on ${sq.name}`);}
  broadcastState();drawBoard();
  const cb=pendingBuyCallback;pendingBuyCallback=null;
  if(cb)cb();else hostNextTurn();
}

function hostDoBuild(pidx,sqIdx){
  const sq=SQUARES[sqIdx],p=PLAYERS[pidx];
  if(ownership[sqIdx]!==pidx||p.money<sq.houseCost||houses[sqIdx]>=5)return;
  p.money-=sq.houseCost;houses[sqIdx]++;
  hostLog(`${p.emoji} built ${houses[sqIdx]>=5?'🪸 Coral Castle':'🏠 house'} on ${sq.emoji} ${sq.name}`);
  broadcastState();drawBoard();renderMyTurn();
}

function hostNextTurn(){
  do{currentPlayer=(currentPlayer+1)%PLAYERS.length;}while(PLAYERS[currentPlayer].bankrupt&&PLAYERS.some(p=>!p.bankrupt));
  const alive=PLAYERS.filter(p=>!p.bankrupt);
  if(alive.length===1){hostShowWinner(PLAYERS.indexOf(alive[0]));return;}
  broadcastState();renderMyTurn();
}

// Non-host buy modal
channel.subscribe&&channel.subscribe('state',msg=>{
  // When state arrives and it's my turn and there's an unowned square I just landed on
  // handled in applyState already
});

// handle non-host buy offer: if state arrives and I'm currentPlayer on unowned square
const _origApply=applyState;
window.applyState=function(s){
  _origApply(s);
  if(!isHost&&s.currentPlayer===myId){
    const p=PLAYERS[myId],sq=SQUARES[p.pos];
    if((sq.type==='prop'||sq.type==='sub'||sq.type==='utility')&&ownership[p.pos]===null&&p.money>=0){
      showModal(`Buy ${sq.emoji} ${sq.name}?`,
        `Price: 🪙${sq.price}\nYour pearls: 🪙${p.money}`,
        [{label:`Buy 🪙${sq.price}`,cls:'btn-primary',disabled:p.money<sq.price,action:()=>{closeModal();sendAction('buy',{sqIdx:p.pos,confirm:true});}},
         {label:'Pass',cls:'btn-secondary',action:()=>{closeModal();sendAction('buy',{sqIdx:p.pos,confirm:false});}}]);
    }
  }
};

// ── CANVAS TAP ────────────────────────────────────────────────
canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  for(let i=0;i<40;i++){
    const sq=squarePos(i);
    if(mx>=sq.x&&mx<=sq.x+sq.w&&my>=sq.y&&my<=sq.y+sq.h){
      const s=SQUARES[i],ow=ownership[i];
      let body=`${s.emoji} ${s.name}\n`;
      if(s.price)body+=`Price: 🪙${s.price}\n`;
      if(ow!==null)body+=`Owner: ${PLAYERS[ow].emoji} ${PLAYERS[ow].name}\n`;
      if(s.type==='prop'&&s.rent)body+=`Rents: 🪙${s.rent.join(' / ')}\nHouses: ${houses[i]>=5?'Coral Castle🪸':houses[i]}`;
      if(s.type==='sub')body+=`Submarine rent: 🪙${s.subRent.join('/')}`;
      showModal(s.name,body,[{label:'Close',cls:'btn-secondary',action:closeModal}]);return;
    }
  }
});

window.addEventListener('resize',()=>{layoutBoard();drawBoard();});

// Host also processes its own actions directly
if(typeof sendAction!=='undefined'){
  const _origSend=sendAction;
  window.sendAction=function(type,data){
    if(isHost&&data.playerId===undefined){
      // host acting for themselves — process directly
      processAction({type,playerId:myId,...data});
    }else{
      _origSend(type,data);
    }
  };
}
</script>
