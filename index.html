<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fishnoply</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:'Segoe UI',sans-serif;color:#fff;}
#splash{position:fixed;inset:0;background:linear-gradient(180deg,#0a1628 0%,#0d2444 50%,#0a1628 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#splash h1{font-size:52px;color:#00d4ff;text-shadow:0 0 30px #00a8cc,0 0 60px #007799;letter-spacing:4px;margin-bottom:4px;}
#splash .tagline{color:#4ab8d4;font-size:14px;letter-spacing:3px;margin-bottom:8px;}
#splash .credit{color:#1a4a6a;font-size:11px;letter-spacing:2px;margin-bottom:40px;}
#splash .fish-row{font-size:36px;margin-bottom:40px;letter-spacing:8px;}
#splash .start-btn{background:linear-gradient(135deg,#006688,#00aacc);color:#fff;font-size:20px;font-weight:bold;padding:16px 60px;border:none;border-radius:40px;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 24px rgba(0,170,204,0.4);}
#splash .start-btn:active{transform:scale(0.97);}

#game{display:none;position:fixed;inset:0;flex-direction:column;}
#topbar{background:rgba(0,20,40,0.95);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,200,255,0.15);flex-shrink:0;}
#topbar .title{font-size:18px;color:#00d4ff;font-weight:bold;letter-spacing:2px;}
#topbar .pearls{font-size:14px;color:#ffd700;}
#board-wrap{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
#board-canvas{touch-action:none;}

#panel{background:rgba(0,15,35,0.97);border-top:1px solid rgba(0,200,255,0.2);padding:10px 12px;flex-shrink:0;min-height:180px;max-height:220px;overflow-y:auto;}
#panel .turn-header{font-size:13px;color:#00d4ff;font-weight:bold;margin-bottom:6px;letter-spacing:1px;}
#panel .log{font-size:12px;color:#7ab8cc;line-height:1.6;margin-bottom:8px;max-height:60px;overflow-y:auto;}
#panel .actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:9px 18px;border:none;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer;letter-spacing:1px;}
.btn-primary{background:#006688;color:#fff;}
.btn-primary:active{background:#004466;}
.btn-secondary{background:#1a3a4a;color:#7ab8cc;border:1px solid #2a5a6a;}
.btn-secondary:active{background:#0a2030;}
.btn-danger{background:#6a1a1a;color:#ffaaaa;border:1px solid #aa3333;}
.btn-danger:active{background:#4a0a0a;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;}

#dice-display{font-size:80px;text-align:center;text-shadow:0 0 30px #fff;}

#players-bar{background:rgba(0,10,25,0.9);padding:6px 8px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid rgba(0,200,255,0.1);}
.player-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.06);border-radius:20px;padding:4px 10px;font-size:11px;white-space:nowrap;border:1px solid transparent;}

.player-chip.bankrupt{opacity:0.35;}
.chip-token{font-size:16px;}

#prop-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:55;display:none;align-items:flex-end;justify-content:center;}

</style>

const GROUP_COLORS = ['#8B4513','#87CEEB','#FF69B4','#FFA500','#FF4444','#FFFF00','#228B22','#00008B'];
const GROUP_NAMES = ['Brown','Sky Blue','Pink','Orange','Red','Yellow','Green','Dark Blue'];

];

const CURRENT_CARDS = [
  {text:'Ride the current to GO! Collect 🪙200.',action:'goto',val:0,gain:200},
  {text:'You win the Ocean Beauty Contest! Collect 🪙10.',action:'gain',val:10},
  {text:'Pearl income tax refund! Collect 🪙20.',action:'gain',val:20},
  {text:'Go to The Net. Go directly to The Net.',action:'gonet',val:0},
  {text:'Get out of The Net free!',action:'jailcard',val:0},

  {text:'Go back 3 squares.',action:'back',val:3},

  {text:'Make general repairs — 🪙40 per fish, 🪙115 per coral castle.',action:'repairs',val:[40,115]},
];

const PLAYERS = [
  {name:'Shark',emoji:'🦈',color:'#00aaff',isHuman:true,money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false,props:[],doubles:0},
  {name:'Clownfish',emoji:'🐠',color:'#ff6600',isHuman:false,money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false,props:[],doubles:0},
  {name:'Crab',emoji:'🦀',color:'#cc2222',isHuman:false,money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false,props:[],doubles:0},
  {name:'Pufferfish',emoji:'🐡',color:'#228B22',isHuman:false,money:1500,pos:0,inJail:false,jailTurns:0,jailCard:false,bankrupt:false,props:[],doubles:0},
];

const ownership = new Array(40).fill(null);
const houses = new Array(40).fill(0);
let currentPlayer = 0;
let gamePhase = 'roll';
let tideDeck = shuffle([...TIDE_CARDS]);
let currentDeck = shuffle([...CURRENT_CARDS]);
let logLines = [];
let diceResult = [1,1];
let pendingAction = null;
let gameOver = false;

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function addLog(msg){
  logLines.unshift(msg);
  if(logLines.length>30) logLines.pop();
  document.getElementById('log').innerHTML = logLines.slice(0,5).map(l=>`<div>${l}</div>`).join('');
}

  document.getElementById('top-pearls').textContent = '🪙 '+PLAYERS[0].money;
}

function updatePlayersBar(){
  const bar = document.getElementById('players-bar');
  bar.innerHTML = PLAYERS.map((p,i)=>`

}

// ── BOARD DRAWING ──────────────────────────────────────────────
const canvas = document.getElementById('board-canvas');
const bctx = canvas.getContext('2d');
let CELL, BOARD_SIZE, OFFSET_X, OFFSET_Y;

function layoutBoard(){
  const wrap = document.getElementById('board-wrap');
  const size = Math.min(wrap.clientWidth, wrap.clientHeight) - 8;
  canvas.width = size; canvas.height = size;
  BOARD_SIZE = size;
  CELL = size / 11;
  OFFSET_X = 0; OFFSET_Y = 0;
}

function squarePos(idx){
  // 40 squares around the board
  // bottom row: 0-10 (right to left), right col: 11-19 (bottom to top), top row: 20-30 (left to right), left col: 31-39 (top to bottom)
  const C = CELL, S = BOARD_SIZE;
  if(idx<=10){ // bottom row, right to left
    return {x: S - (idx+1)*C, y: S - C*1.6, w: idx===0||idx===10?C*1.6:C, h:C*1.6, corner:idx===0||idx===10};
  } else if(idx<=19){ // right col, bottom to top
    const r=idx-10;
    return {x: S - C*1.6, y: S - C*1.6 - r*C, w:C*1.6, h:C, corner:false};
  } else if(idx<=30){ // top row, left to right
    const r=idx-20;
    return {x: r*C, y: 0, w: idx===20||idx===30?C*1.6:C, h:C*1.6, corner:idx===20||idx===30};
  } else { // left col, top to bottom
    const r=idx-30;
    return {x: 0, y: C*1.6 + (r-1)*C, w:C*1.6, h:C, corner:false};
  }
}

function drawBoard(){
  const C=CELL, S=BOARD_SIZE;
  bctx.clearRect(0,0,S,S);

  // background
  bctx.fillStyle='#0a1628';
  bctx.fillRect(0,0,S,S);

  // center area
  bctx.fillStyle='#0d2040';
  bctx.fillRect(C*1.6,C*1.6,S-C*3.2,S-C*3.2);

  // center title
  bctx.fillStyle='#00d4ff';
  bctx.font=`bold ${Math.round(C*0.55)}px sans-serif`;
  bctx.textAlign='center';
  bctx.textBaseline='middle';
  bctx.fillText('🌊 FISHNOPLY',S/2,S/2-C*0.4);
  bctx.fillStyle='#4ab8d4';
  bctx.font=`${Math.round(C*0.28)}px sans-serif`;
  bctx.fillText('Created by Ethan & Elroy Fang · 2026',S/2,S/2+C*0.2);

  // draw all squares
  for(let i=0;i<40;i++) drawSquare(i);

  // draw tokens
  PLAYERS.forEach((p,pi)=>{
    if(p.bankrupt) return;
    const sq = squarePos(p.pos);
    const cx = sq.x + sq.w/2 + (pi%2===0?-6:6);
    const cy = sq.y + sq.h/2 + (pi<2?-5:5);
    bctx.font=`${Math.round(C*0.32)}px sans-serif`;
    bctx.textAlign='center';
    bctx.textBaseline='middle';
    bctx.fillText(p.emoji, cx, cy);
  });
}

function drawSquare(i){
  const sq=squarePos(i);
  const s=SQUARES[i];
  const C=CELL;

  // border
  bctx.strokeStyle='rgba(0,200,255,0.25)';
  bctx.lineWidth=0.5;
  bctx.strokeRect(sq.x,sq.y,sq.w,sq.h);

  // color strip for properties
  if(s.type==='prop'){
    const col=GROUP_COLORS[s.group];
    // determine strip position based on board side
    bctx.fillStyle=col;
    if(i<=10){ // bottom
      bctx.fillRect(sq.x,sq.y+sq.h-8,sq.w,8);
    } else if(i<=19){ // right
      bctx.fillRect(sq.x,sq.y,8,sq.h);
    } else if(i<=30){ // top
      bctx.fillRect(sq.x,sq.y,sq.w,8);
    } else { // left
      bctx.fillRect(sq.x+sq.w-8,sq.y,8,sq.h);
    }
  }

  // owner highlight
  if(ownership[i]!==null){
    const owner=PLAYERS[ownership[i]];
    bctx.fillStyle=owner.color+'33';
    bctx.fillRect(sq.x+1,sq.y+1,sq.w-2,sq.h-2);
  }

  // houses/castles
  if(houses[i]>0){
    const hCount=Math.min(houses[i],4);
    const isHotel=houses[i]>=5;
    bctx.fillStyle=isHotel?'#ff4444':'#00cc44';
    if(!sq.corner){
      for(let h=0;h<(isHotel?1:hCount);h++){
        bctx.fillRect(sq.x+2+h*5, sq.y+2, 4, 4);
      }
    }
  }

  // emoji & text
  const fontSize = sq.corner ? C*0.38 : C*0.28;
  bctx.font=`${Math.round(fontSize)}px sans-serif`;
  bctx.textAlign='center';
  bctx.textBaseline='middle';
  const cx=sq.x+sq.w/2, cy=sq.y+sq.h/2;

  if(sq.corner){
    bctx.fillText(s.emoji, cx, cy-6);
    bctx.fillStyle='#7ab8cc';
    bctx.font=`${Math.round(C*0.18)}px sans-serif`;
    bctx.fillText(s.name, cx, cy+10);
  } else {
    // rotate text for sides
    bctx.save();
    if(i>=11&&i<=19){ bctx.translate(cx,cy); bctx.rotate(-Math.PI/2); bctx.translate(-cx,-cy); }
    else if(i>=31&&i<=39){ bctx.translate(cx,cy); bctx.rotate(Math.PI/2); bctx.translate(-cx,-cy); }
    bctx.fillText(s.emoji, cx, cy-4);
    bctx.fillStyle='#5a9aaa';
    bctx.font=`${Math.round(C*0.15)}px sans-serif`;
    const shortName = s.name.length>9?s.name.substring(0,9):s.name;
    bctx.fillText(shortName, cx, cy+8);
    if(s.price){
      bctx.fillStyle='#ffd700';
      bctx.font=`${Math.round(C*0.14)}px sans-serif`;
      bctx.fillText('🪙'+s.price, cx, cy+18);
    }
    bctx.restore();
  }
}

// ── GAME LOGIC ─────────────────────────────────────────────────

function rollDice(){
  const d1=Math.floor(Math.random()*6)+1;
  const d2=Math.floor(Math.random()*6)+1;
  diceResult=[d1,d2];
  return [d1,d2];
}

const DICE_EMOJI=['','⚀','⚁','⚂','⚃','⚄','⚅'];

function animateDice(d1,d2,cb){
  const overlay=document.getElementById('dice-overlay');
  const display=document.getElementById('dice-display');
  overlay.style.display='flex';
  let count=0;
  const interval=setInterval(()=>{
    const r1=Math.floor(Math.random()*6)+1;
    const r2=Math.floor(Math.random()*6)+1;
    display.textContent=DICE_EMOJI[r1]+' '+DICE_EMOJI[r2];
    count++;
    if(count>8){
      clearInterval(interval);
      display.textContent=DICE_EMOJI[d1]+' '+DICE_EMOJI[d2];
      setTimeout(()=>{ overlay.style.display='none'; cb(); },600);
    }
  },80);
}

function movePlayer(pidx, steps, cb){
  const p=PLAYERS[pidx];
  const oldPos=p.pos;
  p.pos=(p.pos+steps)%40;
  if(p.pos<oldPos && steps>0){ // passed GO
    p.money+=200;
    addLog(`${p.emoji} passed GO — collected 🪙200!`);
  }
  updateTopPearls();
  drawBoard();
  if(cb) cb();
}

function gotoSquare(pidx, sq, collectGo, cb){
  const p=PLAYERS[pidx];
  if(sq<p.pos && collectGo){ p.money+=200; addLog(`${p.emoji} passed GO — 🪙200!`); }
  p.pos=sq;
  updateTopPearls();
  drawBoard();
  if(cb) cb();
}

function countPlayerSubs(pidx){
  return SQUARES.filter((s,i)=>s.type==='sub'&&ownership[i]===pidx).length;
}

function countPlayerUtils(pidx){
  return SQUARES.filter((s,i)=>s.type==='utility'&&ownership[i]===pidx).length;
}

function ownsGroup(pidx, group){
  const groupProps=SQUARES.map((s,i)=>({s,i})).filter(({s})=>s.type==='prop'&&s.group===group);
  return groupProps.every(({i})=>ownership[i]===pidx);
}

function calcRent(sqIdx, diceTotal){
  const s=SQUARES[sqIdx];
  const owner=ownership[sqIdx];
  if(owner===null) return 0;
  if(s.type==='sub'){
    const count=countPlayerSubs(owner);
    return s.subRent[count-1];
  }
  if(s.type==='utility'){
    const count=countPlayerUtils(owner);
    return diceTotal*(count===1?4:10);
  }
  if(s.type==='prop'){
    const h=houses[sqIdx];
    if(h>0) return s.rent[Math.min(h,5)];
    if(ownsGroup(owner,s.group)) return s.rent[0]*2;
    return s.rent[0];
  }
  return 0;
}

function payRent(from, to, amount, cb){
  PLAYERS[from].money=Math.max(0,PLAYERS[from].money-amount);
  PLAYERS[to].money+=amount;
  addLog(`${PLAYERS[from].emoji} paid 🪙${amount} rent to ${PLAYERS[to].emoji}`);
  updateTopPearls();
  updatePlayersBar();
  checkBankruptcy(from, cb);
}

function checkBankruptcy(pidx, cb){
  const p=PLAYERS[pidx];
  if(p.money<=0){
    p.bankrupt=true;
    addLog(`💀 ${p.emoji} ${p.name} is bankrupt! Game over for them.`);
    // return all properties
    SQUARES.forEach((s,i)=>{ if(ownership[i]===pidx){ ownership[i]=null; houses[i]=0; } });
    updatePlayersBar();
    drawBoard();
    const alive=PLAYERS.filter(pl=>!pl.bankrupt);
    if(alive.length===1){
      showWinner(PLAYERS.indexOf(alive[0]));
      return;
    }
  }
  if(cb) cb();
}

function showWinner(pidx){
  gameOver=true;
  const p=PLAYERS[pidx];
  showModal(`${p.emoji} ${p.name} WINS!`,`${p.name} dominates the ocean with 🪙${p.money} pearls!\n\nAll other creatures are bankrupt.`,[
    {label:'Play Again',cls:'btn-primary',action:()=>location.reload()}
  ]);
}

function drawTideCard(){
  if(tideDeck.length===0) tideDeck=shuffle([...TIDE_CARDS]);
  return tideDeck.pop();
}
function drawCurrentCard(){
  if(currentDeck.length===0) currentDeck=shuffle([...CURRENT_CARDS]);
  return currentDeck.pop();
}

function applyCard(pidx, card, cb){
  const p=PLAYERS[pidx];
  addLog(`${p.emoji} draws: "${card.text}"`);
  switch(card.action){
    case 'gain':
      p.money+=card.val;
      updateTopPearls(); updatePlayersBar();
      if(cb) cb(); break;
    case 'pay':
      p.money=Math.max(0,p.money-card.val);
      updateTopPearls(); updatePlayersBar();
      checkBankruptcy(pidx,cb); break;
    case 'goto':
      gotoSquare(pidx,card.val,true,()=>landOn(pidx,diceResult[0]+diceResult[1],cb)); break;
    case 'gonet':
      p.inJail=true; p.jailTurns=0; p.pos=10;
      drawBoard(); updatePlayersBar();
      if(cb) cb(); break;
    case 'jailcard':
      p.jailCard=true;
      if(cb) cb(); break;
    case 'back':
      p.pos=(p.pos-card.val+40)%40;
      drawBoard();
      landOn(pidx,diceResult[0]+diceResult[1],cb); break;
    case 'collectall':
      PLAYERS.forEach((pl,i)=>{ if(i!==pidx&&!pl.bankrupt){ pl.money=Math.max(0,pl.money-card.val); p.money+=card.val; } });
      updateTopPearls(); updatePlayersBar();
      if(cb) cb(); break;
    case 'payall':
      PLAYERS.forEach((pl,i)=>{ if(i!==pidx&&!pl.bankrupt){ pl.money+=card.val; p.money=Math.max(0,p.money-card.val); } });
      updateTopPearls(); updatePlayersBar();
      checkBankruptcy(pidx,cb); break;
    case 'repairs':
      let total=0;
      SQUARES.forEach((s,i)=>{ if(ownership[i]===pidx&&houses[i]>0){ total+=houses[i]<5?houses[i]*card.val[0]:card.val[1]; } });
      p.money=Math.max(0,p.money-total);
      addLog(`${p.emoji} paid 🪙${total} for repairs`);
      updateTopPearls(); updatePlayersBar();
      checkBankruptcy(pidx,cb); break;
    default:
      if(cb) cb();
  }
}

function landOn(pidx, diceTotal, cb){
  const p=PLAYERS[pidx];
  const sq=SQUARES[p.pos];
  const owner=ownership[p.pos];

  switch(sq.type){
    case 'go':
      if(cb) cb(); break;
    case 'jail': case 'freeswim':
      if(cb) cb(); break;
    case 'gonet':
      p.inJail=true; p.jailTurns=0; p.pos=10;
      addLog(`${p.emoji} sent to The Net!`);
      drawBoard(); updatePlayersBar();
      if(cb) cb(); break;
    case 'tax':
      p.money=Math.max(0,p.money-sq.amount);
      addLog(`${p.emoji} paid 🪙${sq.amount} tax`);
      updateTopPearls(); updatePlayersBar();
      checkBankruptcy(pidx,cb); break;
    case 'tide':
      const tc=drawTideCard();
      applyCard(pidx,tc,cb); break;
    case 'current':
      const cc=drawCurrentCard();
      applyCard(pidx,cc,cb); break;
    case 'prop': case 'sub': case 'utility':
      if(owner===null){
        // unowned
        if(p.isHuman){
          offerBuy(pidx, p.pos, cb);
        } else {
          aiDecideBuy(pidx, p.pos, cb);
        }
      } else if(owner===pidx){
        addLog(`${p.emoji} landed on own property`);
        if(cb) cb();
      } else {
        const rent=calcRent(p.pos, diceTotal);
        addLog(`${p.emoji} owes 🪙${rent} to ${PLAYERS[owner].emoji}`);
        payRent(pidx, owner, rent, cb);
      }
      break;
    default:
      if(cb) cb();
  }
}

function offerBuy(pidx, sqIdx, cb){
  const sq=SQUARES[sqIdx];
  const p=PLAYERS[pidx];
  showModal(`Buy ${sq.emoji} ${sq.name}?`,
    `Price: 🪙${sq.price}\nYour pearls: 🪙${p.money}\n\n${sq.type==='prop'?`Group: ${GROUP_NAMES[sq.group]}\nBase rent: 🪙${sq.rent[0]}`:''}`,
    [
      {label:`Buy 🪙${sq.price}`,cls:'btn-primary',disabled:p.money<sq.price,action:()=>{
        p.money-=sq.price; ownership[sqIdx]=pidx;
        addLog(`${p.emoji} bought ${sq.emoji} ${sq.name} for 🪙${sq.price}`);
        updateTopPearls(); updatePlayersBar(); drawBoard();
        closeModal(); if(cb) cb();
      }},
      {label:'Pass',cls:'btn-secondary',action:()=>{ closeModal(); if(cb) cb(); }},
    ]
  );
}

function aiDecideBuy(pidx, sqIdx, cb){
  const sq=SQUARES[sqIdx];
  const p=PLAYERS[pidx];
  const willBuy = p.money>sq.price*1.2 && Math.random()>0.25;
  if(willBuy){
    p.money-=sq.price; ownership[sqIdx]=pidx;
    addLog(`${p.emoji} ${p.name} bought ${sq.emoji} ${sq.name} for 🪙${sq.price}`);
    updateTopPearls(); updatePlayersBar(); drawBoard();
  } else {
    addLog(`${p.emoji} ${p.name} passed on ${sq.name}`);
  }
  setTimeout(cb,600);
}

function aiTakeTurn(pidx, cb){
  const p=PLAYERS[pidx];
  const [d1,d2]=rollDice();
  const total=d1+d2;
  const isDoubles=d1===d2;
  addLog(`${p.emoji} ${p.name} rolls ${DICE_EMOJI[d1]}${DICE_EMOJI[d2]} (${total})`);

  if(p.inJail){
    if(isDoubles){ p.inJail=false; addLog(`${p.emoji} rolled doubles — out of The Net!`); }
    else{
      p.jailTurns++;
      if(p.jailTurns>=3){
        p.money=Math.max(0,p.money-50); p.inJail=false;
        addLog(`${p.emoji} paid 🪙50 bail`);
      } else {
        addLog(`${p.emoji} stuck in The Net (turn ${p.jailTurns})`);
        updatePlayersBar();
        setTimeout(cb,800); return;
      }
    }
  }

  setTimeout(()=>{
    movePlayer(pidx, total, ()=>{
      setTimeout(()=>landOn(pidx, total, ()=>{
        // AI build houses
        aiMaybeBuilds(pidx);
        updatePlayersBar();
        setTimeout(cb, 600);
      }),400);
    });
  },400);
}

function aiMaybeBuilds(pidx){
  const p=PLAYERS[pidx];
  SQUARES.forEach((sq,i)=>{
    if(sq.type==='prop' && ownership[i]===pidx && ownsGroup(pidx,sq.group) && p.money>sq.houseCost*2 && houses[i]<5 && Math.random()>0.55){
      const maxInGroup=Math.max(...SQUARES.map((s2,i2)=>s2.type==='prop'&&s2.group===sq.group?houses[i2]:0));
      if(houses[i]<=maxInGroup){
        p.money-=sq.houseCost; houses[i]++;
        addLog(`${p.emoji} built on ${sq.emoji} ${sq.name}`);
      }
    }
  });
}

// ── HUMAN TURN UI ──────────────────────────────────────────────
function setActions(btns){
  const el=document.getElementById('actions');
  el.innerHTML='';
  btns.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='btn '+(b.cls||'btn-primary');
    btn.textContent=b.label;
    if(b.disabled) btn.disabled=true;
    btn.onclick=b.action;
    el.appendChild(btn);
  });
}

function setHeader(txt){
  document.getElementById('turn-header').textContent=txt;
}

function humanTurn(){
  const p=PLAYERS[0];
  if(p.bankrupt){ nextTurn(); return; }
  setHeader(`Your turn, ${p.emoji} Shark!`);

  if(p.inJail){
    setActions([
      {label:'Roll for doubles',cls:'btn-primary',action:()=>humanRollJail()},
      ...(p.jailCard?[{label:'Use Get Out card',cls:'btn-secondary',action:()=>{ p.jailCard=false; p.inJail=false; addLog('Shark used Get Out of Net card!'); humanRollNormal(); }}]:[]),
      {label:`Pay 🪙50 bail`,cls:'btn-secondary',disabled:p.money<50,action:()=>{ p.money-=50; p.inJail=false; updateTopPearls(); humanRollNormal(); }},
    ]);
    return;
  }
  const buildBtns = getBuildActions();
  setActions([
    {label:'🎲 Roll Dice',cls:'btn-primary',action:()=>humanRollNormal()},
    ...(buildBtns.length?[{label:'🪸 Build',cls:'btn-secondary',action:()=>showBuildMenu()}]:[]),
    {label:'🗺️ Properties',cls:'btn-secondary',action:()=>showPropMenu()},
  ]);
}

function humanRollJail(){
  const p=PLAYERS[0];
  const [d1,d2]=rollDice();
  const total=d1+d2;
  animateDice(d1,d2,()=>{
    if(d1===d2){
      p.inJail=false;
      addLog(`Shark rolled doubles ${DICE_EMOJI[d1]}${DICE_EMOJI[d2]} — out of The Net!`);
      movePlayer(0,total,()=>landOn(0,total,()=>endHumanTurn(false)));
    } else {
      p.jailTurns++;
      addLog(`Shark stayed in The Net (${p.jailTurns}/3)`);
      if(p.jailTurns>=3){ p.money=Math.max(0,p.money-50); p.inJail=false; addLog('Shark paid 🪙50 bail'); updateTopPearls(); movePlayer(0,total,()=>landOn(0,total,()=>endHumanTurn(false))); }
      else { updatePlayersBar(); endHumanTurn(false); }
    }
  });
}

function humanRollNormal(){
  const p=PLAYERS[0];
  const [d1,d2]=rollDice();
  const total=d1+d2;
  const isDoubles=d1===d2;
  addLog(`Shark rolls ${DICE_EMOJI[d1]}${DICE_EMOJI[d2]} (${total})${isDoubles?' DOUBLES!':''}`);
  setActions([]);
  animateDice(d1,d2,()=>{
    movePlayer(0,total,()=>{
      landOn(0,total,()=>endHumanTurn(isDoubles));
    });
  });
}

function endHumanTurn(rolledDoubles){
  updateTopPearls(); updatePlayersBar();
  if(rolledDoubles && !PLAYERS[0].inJail){
    addLog('Doubles! Roll again.');
    humanTurn();
  } else {
    nextTurn();
  }
}

function nextTurn(){
  do {
    currentPlayer=(currentPlayer+1)%4;
  } while(PLAYERS[currentPlayer].bankrupt && PLAYERS.some(p=>!p.bankrupt));

  const alive=PLAYERS.filter(p=>!p.bankrupt);
  if(alive.length===1){ showWinner(PLAYERS.indexOf(alive[0])); return; }

  updatePlayersBar();
  if(currentPlayer===0){
    humanTurn();
  } else {
    setHeader(`${PLAYERS[currentPlayer].emoji} ${PLAYERS[currentPlayer].name}'s turn...`);
    setActions([]);
    setTimeout(()=>{
      aiTakeTurn(currentPlayer,()=>{
        updatePlayersBar();
        nextTurn();
      });
    },800);
  }
}

// ── BUILD MENU ─────────────────────────────────────────────────
function getBuildActions(){
  const p=PLAYERS[0];
  return SQUARES.map((sq,i)=>{
    if(sq.type!=='prop'||ownership[i]!==0) return null;
    if(!ownsGroup(0,sq.group)) return null;
    if(houses[i]>=5) return null;
    if(p.money<sq.houseCost) return null;
    const groupHouses=SQUARES.map((s2,i2)=>s2.type==='prop'&&s2.group===sq.group?houses[i2]:0);
    const minH=Math.min(...groupHouses);
    if(houses[i]>minH) return null;
    return {sq,i};
  }).filter(Boolean);
}

function showBuildMenu(){
  const builds=getBuildActions();
  if(!builds.length){ addLog('Nothing to build on right now'); return; }
  const p=PLAYERS[0];
  const items=builds.map(({sq,i})=>{
    const label=houses[i]===4?`🪸 Coral Castle on ${sq.emoji} ${sq.name} 🪙${sq.houseCost}`:`🏠 House on ${sq.emoji} ${sq.name} 🪙${sq.houseCost}`;
    return {label,cls:'btn-primary',action:()=>{
      p.money-=sq.houseCost; houses[i]++;
      addLog(`Shark built ${houses[i]===5?'🪸 Coral Castle':'🏠 house'} on ${sq.emoji} ${sq.name}`);
      updateTopPearls(); drawBoard(); closeModal();
      humanTurn();
    }};
  });
  showModal('🪸 Build',`Your pearls: 🪙${p.money}\n\nSelect where to build:`,[
    ...items,
    {label:'Cancel',cls:'btn-secondary',action:()=>{ closeModal(); humanTurn(); }},
  ]);
}

function showPropMenu(){
  const myProps=SQUARES.map((sq,i)=>({sq,i})).filter(({i})=>ownership[i]===0);
  if(!myProps.length){ showModal('🗺️ Properties','You own no properties yet!',[{label:'OK',cls:'btn-secondary',action:closeModal}]); return; }
  const lines=myProps.map(({sq,i})=>`${sq.emoji} ${sq.name}${houses[i]>0?' '+Array(Math.min(houses[i],4)).fill('🏠').join('')+(houses[i]>=5?'🪸':''):''}  Rent:🪙${calcRent(i,7)}`).join('\n');
  showModal('🗺️ Your Properties',lines,[{label:'Close',cls:'btn-secondary',action:()=>{ closeModal(); humanTurn(); }}]);
}

// ── MODAL ──────────────────────────────────────────────────────
function showModal(title, body, actions){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').textContent=body;
  const actEl=document.getElementById('modal-actions');
  actEl.innerHTML='';
  actions.forEach(a=>{
    const btn=document.createElement('button');
    btn.className='btn '+(a.cls||'btn-primary');
    btn.textContent=a.label;
    if(a.disabled) btn.disabled=true;
    btn.onclick=a.action;
    actEl.appendChild(btn);
  });
  document.getElementById('modal-bg').style.display='flex';
}

function closeModal(){
  document.getElementById('modal-bg').style.display='none';
}

// ── START ──────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click',()=>{
  document.getElementById('splash').style.display='none';
  document.getElementById('game').style.display='flex';
  layoutBoard();
  drawBoard();
  updatePlayersBar();
  updateTopPearls();
  humanTurn();
});

window.addEventListener('resize',()=>{ layoutBoard(); drawBoard(); });

// tap on square info
canvas.addEventListener('click', e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  for(let i=0;i<40;i++){
    const sq=squarePos(i);
    if(mx>=sq.x&&mx<=sq.x+sq.w&&my>=sq.y&&my<=sq.y+sq.h){
      const s=SQUARES[i];
      const owner=ownership[i];
      let body=`${s.emoji} ${s.name}\n`;
      if(s.price) body+=`Price: 🪙${s.price}\n`;
      if(owner!==null) body+=`Owner: ${PLAYERS[owner].emoji} ${PLAYERS[owner].name}\n`;
      if(s.type==='prop'&&s.rent) body+=`Rents: 🪙${s.rent.join(' / ')}\nHouses: ${houses[i]<5?houses[i]:'Coral Castle'}`;
      if(s.type==='sub') body+=`Submarine — rent by subs owned: 🪙${s.subRent.join('/')}`;
      showModal(s.name, body, [{label:'Close',cls:'btn-secondary',action:closeModal}]);
      return;
    }
  }
});
</script>
